name: Update flake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  bump-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref_name }} # Branch tip, not trigger SHA

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump flake.lock
        run: |
          nix flake update

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Bump flake.lock"

  bump-nix:
    needs: bump-lock
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app:
          - kharon
          - commodore
          # Add new apps here, one per line
      max-parallel: 1 # Jobs push to the same branch; run sequentially to avoid conflicts
      fail-fast: false # One app failing to update should not block the others
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref_name }} # Branch tip — bump-lock and previous matrix jobs have pushed

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump Nix package version + hashes
        run: |
          nix-shell -p nix-update --run "nix-update --flake ${{ matrix.app }} --override-filename ${{ matrix.app }}.nix"

      - name: Build
        run: |
          nix build .#${{ matrix.app }}

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Bump ${{ matrix.app }} package"
